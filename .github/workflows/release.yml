name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure native build (static CRT)
        run: cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCLXCPP_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build native (clxreader + thumbnail provider)
        run: cmake --build build-native

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: echo "ver=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installers + portable zips (FD + SC)
        shell: pwsh
        run: ./installer/prepare.ps1 -AppVersion "${{ steps.version.outputs.ver }}" -SkipNative

      - name: Upload FD/SC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clx-fdsc
          path: |
            dist/ClxViewer-*-installer.exe
            dist/ClxViewer-*-portable.zip
          retention-days: 1

  # .NET Framework 4.8 variant (net48 branch): native DLLs + net48 viewer,
  # packaged as its own installer + portable zip.
  build-net48:
    runs-on: windows-latest
    steps:
      - name: Checkout net48 (with submodules)
        uses: actions/checkout@v4
        with:
          ref: net48
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure native build (static CRT)
        run: cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCLXCPP_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build native (clxreader + thumbnail provider)
        run: cmake --build build-native

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: echo "ver=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build net48 installer + portable
        shell: pwsh
        run: ./installer/prepare.ps1 -AppVersion "${{ steps.version.outputs.ver }}" -SkipNative -Net48

      - name: Upload net48 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clx-net48
          path: |
            dist/ClxViewer-*-net48-installer.exe
            dist/ClxViewer-*-net48-portable.zip
          retention-days: 1

  # Assemble the release only after both build jobs succeed. All artifacts are
  # produced by CI; nothing is uploaded from a local machine.
  release:
    needs: [build, build-net48]
    runs-on: ubuntu-latest
    steps:
      - name: Download FD/SC artifacts
        uses: actions/download-artifact@v4
        with:
          name: clx-fdsc
          path: rel
          merge-multiple: true

      - name: Download net48 artifacts
        uses: actions/download-artifact@v4
        with:
          name: clx-net48
          path: rel
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rel/ClxViewer-*-installer.exe
            rel/ClxViewer-*-portable.zip
          generate_release_notes: true
